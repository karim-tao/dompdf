<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="description"
    content="Percentage heights of the content of a stretched cell resolve against the final height of the cell, so an image with max-height: 100% fills the row">
<style>
@page {
    size: 400pt 400pt;
    margin: 20pt;
}

body {
    font-family: DejaVu Sans;
    font-size: 10pt;
}

table {
    width: 100%;
    height: 340pt;
    border-collapse: collapse;
}

td {
    padding: 2pt;
    border: 1pt solid black;
    vertical-align: top;
}

.rest {
    height: 100%;
}

.image {
    text-align: center;
    line-height: 0;
    background-color: pink;
}

img {
    max-width: 100%;
    max-height: 100%;
}
</style>
</head>

<body>
    <table>
        <tr><td>title row</td></tr>
        <tr class="rest"><td class="image"><img src="../../jamaica.jpg"></td></tr>
    </table>
</body>

</html>
